<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Hamidreza — IT Student, Backend, Async Systems and Full-Stack Developer in Germany">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="60%" stop-color="#111822" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent-line-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3FB950" />
    </linearGradient>
    <radialGradient id="glow-dark" cx="85%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D" opacity="0.65" />
    </pattern>
  </defs>

  <!-- Base container -->
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#bg-dark)" stroke="#30363D" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#glow-dark)" />
  <rect x="640" y="16" width="540" height="248" rx="12" fill="url(#dots-dark)" opacity="0.7" />

  <!-- Top subtle accent bar -->
  <rect x="48" y="42" width="64" height="3.5" rx="2" fill="url(#accent-line-dark)" />

  <!-- Eyebrow -->
  <text x="124" y="48" fill="#8B949E" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="600" letter-spacing="1.8">IT STUDENT · GERMANY</text>

  <!-- Main Name -->
  <text x="48" y="122" fill="#F0F6FC" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="2">HAMIDREZA</text>

  <!-- Subtitle -->
  <text x="48" y="162" fill="#C9D1D9" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Backend, Async Systems &amp; Full-Stack Automation Developer</text>

  <!-- Minimal capability pills -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="500">
    <rect x="48" y="196" width="152" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="124" y="215.5" fill="#58A6FF" text-anchor="middle">Python · FastAPI</text>

    <rect x="212" y="196" width="152" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="288" y="215.5" fill="#79C0FF" text-anchor="middle">Node.js · Express</text>

    <rect x="376" y="196" width="134" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="443" y="215.5" fill="#3FB950" text-anchor="middle">Linux &amp; CI/CD</text>

    <rect x="522" y="196" width="138" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="591" y="215.5" fill="#D2A8FF" text-anchor="middle">Async &amp; Bots</text>
  </g>

  <!-- Right-side minimalist technical card -->
  <g transform="translate(744, 48)">
    <rect x="0" y="0" width="404" height="184" rx="12" fill="#161B22" fill-opacity="0.92" stroke="#30363D" stroke-width="1.2" />
    <!-- Window header -->
    <line x1="0" y1="34" x2="404" y2="34" stroke="#21262D" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#30363D" />
    <circle cx="36" cy="17" r="4.5" fill="#30363D" />
    <circle cx="52" cy="17" r="4.5" fill="#30363D" />
    <text x="386" y="21" fill="#6E7681" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11">profile.yml</text>

    <!-- YAML content -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5">
      <text x="22" y="64" fill="#79C0FF">role:</text>
      <text x="108" y="64" fill="#E6EDF3">IT Student &amp; Systems Builder</text>

      <text x="22" y="92" fill="#79C0FF">location:</text>
      <text x="108" y="92" fill="#E6EDF3">Germany</text>

      <text x="22" y="120" fill="#79C0FF">stack:</text>
      <text x="108" y="120" fill="#A5D6FF">[Python, FastAPI, Node.js, Mongo]</text>

      <text x="22" y="148" fill="#79C0FF">focus:</text>
      <text x="108" y="148" fill="#3FB950">[Async, Mini Apps, Linux, Testing]</text>
    </g>
  </g>
</svg>
