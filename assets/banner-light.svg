<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Hamidreza — IT Student, Backend, Full-Stack and Automation Developer in Germany">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F6F8FA" />
      <stop offset="100%" stop-color="#EEF2F7" />
    </linearGradient>
    <linearGradient id="accent-line-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969DA" />
      <stop offset="55%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1A7F37" />
    </linearGradient>
    <radialGradient id="glow-light" cx="85%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0969DA" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D0D7DE" opacity="0.9" />
    </pattern>
  </defs>

  <!-- Base container -->
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#bg-light)" stroke="#D0D7DE" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="url(#glow-light)" />
  <rect x="640" y="16" width="540" height="248" rx="12" fill="url(#dots-light)" opacity="0.7" />

  <!-- Top subtle accent bar -->
  <rect x="48" y="42" width="64" height="3.5" rx="2" fill="url(#accent-line-light)" />

  <!-- Eyebrow -->
  <text x="124" y="48" fill="#57606A" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="600" letter-spacing="1.8">IT STUDENT · GERMANY</text>

  <!-- Main Name -->
  <text x="48" y="122" fill="#1F2328" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="2">HAMIDREZA</text>

  <!-- Subtitle -->
  <text x="48" y="162" fill="#424A53" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Backend, Full-Stack &amp; Automation Developer</text>

  <!-- Minimal capability pills -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="500">
    <rect x="48" y="196" width="88" height="30" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text x="92" y="215.5" fill="#0969DA" text-anchor="middle">Python</text>

    <rect x="148" y="196" width="96" height="30" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text x="196" y="215.5" fill="#0550AE" text-anchor="middle">Node.js</text>

    <rect x="256" y="196" width="128" height="30" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text x="320" y="215.5" fill="#1A7F37" text-anchor="middle">Linux &amp; Ops</text>

    <rect x="396" y="196" width="136" height="30" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <text x="464" y="215.5" fill="#8250DF" text-anchor="middle">Automation</text>
  </g>

  <!-- Right-side minimalist technical card -->
  <g transform="translate(760, 48)">
    <rect x="0" y="0" width="388" height="184" rx="12" fill="#FFFFFF" fill-opacity="0.95" stroke="#D0D7DE" stroke-width="1.2" />
    <!-- Window header -->
    <line x1="0" y1="34" x2="388" y2="34" stroke="#E5E9EF" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#D0D7DE" />
    <circle cx="36" cy="17" r="4.5" fill="#D0D7DE" />
    <circle cx="52" cy="17" r="4.5" fill="#D0D7DE" />
    <text x="370" y="21" fill="#6E7781" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11">profile.yml</text>

    <!-- YAML content -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13">
      <text x="22" y="64" fill="#0969DA">role:</text>
      <text x="116" y="64" fill="#1F2328">IT Student &amp; Builder</text>

      <text x="22" y="92" fill="#0969DA">location:</text>
      <text x="116" y="92" fill="#1F2328">Germany</text>

      <text x="22" y="120" fill="#0969DA">focus:</text>
      <text x="116" y="120" fill="#0550AE">[Backend, Web, DevOps, AI]</text>

      <text x="22" y="148" fill="#0969DA">mindset:</text>
      <text x="116" y="148" fill="#1A7F37">Clean · Tested · Production</text>
    </g>
  </g>
</svg>
